# The Python add-in (excel/python): both builds of asfpy.xll, each driven by the fake Excel host
# (tests/fakehost.c). MinGW-w64 under Wine on Linux, as the design plans; MSVC natively on
# Windows, where setup-python also gives a 32-bit Python. Real Excel stays a checklist run by
# hand (excel/python/spike/README.md).
name: Python add-in

on:
  push:
    paths: ['excel/python/**', '.github/workflows/python-addin.yml']
  pull_request:
    paths: ['excel/python/**', '.github/workflows/python-addin.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wine:
    name: MinGW-w64, fake host under Wine
    runs-on: ubuntu-24.04
    env:
      WINEDEBUG: -all
      WINEDLLOVERRIDES: mscoree,mshtml=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: MinGW-w64 and Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gcc-mingw-w64 wine wine64 wine32:i386
      - name: Windows Pythons from nuget.org (python.org builds), numpy 1.26 in one
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/py"
          cd "$RUNNER_TEMP/py"
          for p in python/3.11.9 python/3.12.10 python/3.14.10 pythonx86/3.12.10; do
            id=${p%/*}; v=${p#*/}
            curl -sSfL -o "$id.$v.zip" "https://api.nuget.org/v3-flatcontainer/$id/$v/$id.$v.nupkg"
            unzip -q "$id.$v.zip" 'tools/*' -d "$id-$v"
          done
          # numpy 2.x needs crealf, which Wine's C runtime lacks
          python -m pip download -q numpy==1.26.4 --only-binary=:all: --platform win_amd64 --python-version 3.12 --no-deps -d wheels
          unzip -q wheels/numpy-*.whl -d python-3.12.10/tools/Lib/site-packages
      - name: Build
        run: python excel/python/xll/build.py mingw
      - name: Fake Excel host
        run: >-
          python excel/python/tests/run_fakehost.py
          "$RUNNER_TEMP/py/python-3.11.9/tools" "$RUNNER_TEMP/py/python-3.12.10/tools"
          "$RUNNER_TEMP/py/python-3.14.10/tools" "$RUNNER_TEMP/py/pythonx86-3.12.10/tools"
      - name: Checksums
        run: cd excel/python/xll/build && sha256sum asfpy64.xll asfpy32.xll | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: asfpy-mingw
          path: |
            excel/python/xll/build/asfpy64.xll
            excel/python/xll/build/asfpy32.xll
            excel/python/xll/build/SHA256SUMS

  windows:
    name: MSVC, fake host on Windows (Python ${{ matrix.python }} ${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: '3.11', arch: x64 }
          - { python: '3.13', arch: x64, numpy: true }
          - { python: '3.14', arch: x64 }
          - { python: '3.12', arch: x86 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.arch }}
      - if: matrix.numpy
        run: python -m pip install -q numpy
      - name: Build
        run: python excel/python/xll/build.py msvc
      - name: Fake Excel host
        run: python excel/python/tests/run_fakehost.py "$env:pythonLocation"
      - name: Checksums
        if: matrix.python == '3.14'
        working-directory: excel/python/xll/build
        run: Get-FileHash asfpy64.xll, asfpy32.xll -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Tee-Object SHA256SUMS
      - if: matrix.python == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: asfpy-msvc
          path: |
            excel/python/xll/build/asfpy64.xll
            excel/python/xll/build/asfpy32.xll
            excel/python/xll/build/SHA256SUMS
